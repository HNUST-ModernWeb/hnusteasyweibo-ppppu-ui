# 应用名称
spring.application.name=personal-blog-back

# 服务器端口
server.port=8081

# MySQL 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/personal_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=pq12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 初始化 SQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.data-locations=classpath:data-mysql.sql

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.personalblogback.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# 文件存储方式：local 或 oss
file.storage.type=local

# 本地文件存储配置（当 file.storage.type=local 时使用）
# 留空则使用项目根目录下的 uploads 文件夹
file.upload.path=
# 返回完整的URL，包含服务器地址
file.upload.url-prefix=http://localhost:8081/uploads

# 阿里云 OSS 配置（当 file.storage.type=oss 时使用）
aliyun.oss.endpoint=oss-cn-hangzhou.aliyuncs.com
aliyun.oss.access-key-id=your-access-key-id
aliyun.oss.access-key-secret=your-access-key-secret
aliyun.oss.bucket-name=your-bucket-name

# JWT 配置
jwt.secret=your-secret-key-here-change-it-in-production
jwt.expiration=86400000

# 跨域配置
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177

# 日志配置
logging.level.org.example.personalblogback=DEBUG
logging.level.org.springframework.web=INFO
