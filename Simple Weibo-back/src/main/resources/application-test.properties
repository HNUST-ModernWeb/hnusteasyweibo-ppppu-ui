# 测试环境配置 - 使用 H2 内存数据库
spring.application.name=personal-blog-back

# 服务器端口
server.port=8080

# H2 数据库配置
spring.datasource.url=jdbc:h2:mem:personal_blog;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console 配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.personalblogback.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# 文件存储路径
file.upload.path=./uploads
file.upload.url-prefix=/uploads

# JWT 配置
jwt.secret=your-secret-key-here-change-it-in-production
jwt.expiration=86400000

# 跨域配置
cors.allowed-origins=http://localhost:5173,http://localhost:5174

# 日志配置
logging.level.org.example.personalblogback=DEBUG
logging.level.org.springframework.web=INFO
